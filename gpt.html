<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sheep Herd Boids</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #2b5d1d; /* grass-ish */
      font-family: system-ui, sans-serif;
    }
    #canvas {
      display: block;
      background: radial-gradient(circle at 20% 20%, #3f7a29, #234515);
    }
    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.4);
      color: white;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    Sheep Herd Boids – click to scatter sheep
  </div>

  <script>
    // --- Vector helper ------------------------------------------------------
    class Vec2 {
      constructor(x = 0, y = 0) {
        this.x = x;
        this.y = y;
      }
      add(v) {
        this.x += v.x;
        this.y += v.y;
        return this;
      }
      sub(v) {
        this.x -= v.x;
        this.y -= v.y;
        return this;
      }
      mul(s) {
        this.x *= s;
        this.y *= s;
        return this;
      }
      div(s) {
        if (s !== 0) {
          this.x /= s;
          this.y /= s;
        }
        return this;
      }
      length() {
        return Math.hypot(this.x, this.y);
      }
      normalize() {
        const len = this.length();
        if (len > 0) this.div(len);
        return this;
      }
      limit(max) {
        const len = this.length();
        if (len > max) {
          this.mul(max / len);
        }
        return this;
      }
      copy() {
        return new Vec2(this.x, this.y);
      }
      static sub(a, b) {
        return new Vec2(a.x - b.x, a.y - b.y);
      }
    }

    // --- Boid (Sheep) -------------------------------------------------------
    class Boid {
      constructor(x, y, herdId, color) {
        this.position = new Vec2(x, y);
        const angle = Math.random() * Math.PI * 2;
        this.velocity = new Vec2(Math.cos(angle), Math.sin(angle));
        this.acceleration = new Vec2();
        this.herdId = herdId;
        this.color = color;
        this.size = 4 + Math.random() * 2; // small variation
      }

      applyForce(force) {
        this.acceleration.add(force);
      }

      update(bounds, params) {
        // Ground animals: clamp speed, slight friction
        this.velocity.add(this.acceleration);
        this.velocity.limit(params.maxSpeed);
        this.position.add(this.velocity);
        this.acceleration.mul(0);

        // Keep inside field with soft steering
        const margin = 40;
        const steer = new Vec2();
        if (this.position.x < margin) steer.x = params.boundaryForce;
        else if (this.position.x > bounds.width - margin) steer.x = -params.boundaryForce;
        if (this.position.y < margin) steer.y = params.boundaryForce;
        else if (this.position.y > bounds.height - margin) steer.y = -params.boundaryForce;

        if (steer.x !== 0 || steer.y !== 0) {
          steer.normalize().mul(params.maxForce * 2);
          this.velocity.add(steer);
        }
      }

      // Flocking behavior
      flock(boids, params) {
        const perceptionRadius = params.perceptionRadius;
        const separationRadius = params.separationRadius;

        const align = new Vec2();
        const cohesion = new Vec2();
        const separation = new Vec2();
        const interHerdSeparation = new Vec2();

        let totalSameHerd = 0;
        let totalNeighbors = 0;
        let totalOtherHerd = 0;

        for (const other of boids) {
          if (other === this) continue;
          const distVec = Vec2.sub(other.position, this.position);
          const d = distVec.length();
          if (d < perceptionRadius) {
            totalNeighbors++;
            const sameHerd = other.herdId === this.herdId;

            if (sameHerd) {
              align.add(other.velocity);
              cohesion.add(other.position);
              totalSameHerd++;
            } else {
              // Other herds: repel a bit so herds stay separate
              if (d > 0) {
                const diff = Vec2.sub(this.position, other.position).div(d);
                interHerdSeparation.add(diff);
                totalOtherHerd++;
              }
            }

            // Separation (avoid bumping into anyone, but stronger in same herd)
            if (d < separationRadius && d > 0) {
              const diff = Vec2.sub(this.position, other.position).div(d); // closer => stronger
              if (sameHerd) diff.mul(1.2); // slightly stronger push from same-herd collisions
              separation.add(diff);
            }
          }
        }

        // Alignment (only within same herd)
        if (totalSameHerd > 0) {
          align.div(totalSameHerd).normalize().mul(params.maxSpeed);
          align.sub(this.velocity).limit(params.maxForce);
        }

        // Cohesion (only within same herd)
        if (totalSameHerd > 0) {
          cohesion.div(totalSameHerd);
          cohesion.sub(this.position).normalize().mul(params.maxSpeed);
          cohesion.sub(this.velocity).limit(params.maxForce);
        }

        // Separation (everyone)
        if (separation.length() > 0) {
          separation.normalize().mul(params.maxSpeed);
          separation.sub(this.velocity).limit(params.maxForce * 1.5);
        }

        // Herd-to-herd separation
        if (totalOtherHerd > 0 && interHerdSeparation.length() > 0) {
          interHerdSeparation.normalize().mul(params.maxSpeed);
          interHerdSeparation.sub(this.velocity).limit(params.maxForce * 1.2);
        }

        // Gentle wander so they don’t freeze in a perfect pattern
        const wander = new Vec2(
          (Math.random() - 0.5) * params.wanderStrength,
          (Math.random() - 0.5) * params.wanderStrength * 0.4 // less vertical wander
        );

        // Combine forces with weights
        align.mul(params.alignWeight);
        cohesion.mul(params.cohesionWeight);
        separation.mul(params.separationWeight);
        interHerdSeparation.mul(params.interHerdSeparationWeight);

        this.applyForce(align);
        this.applyForce(cohesion);
        this.applyForce(separation);
        this.applyForce(interHerdSeparation);
        this.applyForce(wander);
      }

      draw(ctx) {
        const angle = Math.atan2(this.velocity.y, this.velocity.x);

        ctx.save();
        ctx.translate(this.position.x, this.position.y);
        ctx.rotate(angle);

        // Body (ellipse)
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size * 1.8, this.size, 0, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();

        // Head
        ctx.beginPath();
        ctx.arc(this.size * 1.8, 0, this.size * 0.7, 0, Math.PI * 2);
        ctx.fillStyle = "#333";
        ctx.fill();

        // Legs (short lines under body)
        const legOffsetY = this.size * 0.7;
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#222";
        ctx.beginPath();
        ctx.moveTo(-this.size * 0.8, legOffsetY);
        ctx.lineTo(-this.size * 0.8, legOffsetY + this.size * 0.8);
        ctx.moveTo(0, legOffsetY);
        ctx.lineTo(0, legOffsetY + this.size * 0.8);
        ctx.moveTo(this.size * 0.8, legOffsetY);
        ctx.lineTo(this.size * 0.8, legOffsetY + this.size * 0.8);
        ctx.stroke();

        ctx.restore();
      }
    }

    // --- Simulation ---------------------------------------------------------
    class Simulation {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d");
        this.boids = [];

        this.params = {
          maxSpeed: 1.5,
          maxForce: 0.05,
          perceptionRadius: 40,
          separationRadius: 16,
          alignWeight: 0.7,
          cohesionWeight: 0.5,
          separationWeight: 1.3,
          interHerdSeparationWeight: 0.8,
          boundaryForce: 1.0,
          wanderStrength: 0.2
        };

        this.resize();
        window.addEventListener("resize", () => this.resize());

        this.lastTime = performance.now();
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);

        // Click to "scare" nearby sheep
        this.canvas.addEventListener("click", (e) => this.scareSheep(e));
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      addHerd(count, color, centerX, centerY, herdId) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const radius = (Math.random() * 40) + 10;
          const x = centerX + Math.cos(angle) * radius;
          const y = centerY + Math.sin(angle) * radius;
          this.boids.push(new Boid(x, y, herdId, color));
        }
      }

      scareSheep(event) {
        const rect = this.canvas.getBoundingClientRect();
        const clickPos = new Vec2(event.clientX - rect.left, event.clientY - rect.top);
        const scareRadius = 100;

        for (const boid of this.boids) {
          const diff = Vec2.sub(boid.position, clickPos);
          const d = diff.length();
          if (d < scareRadius && d > 0) {
            diff.normalize().mul(0.8); // push away from click
            boid.applyForce(diff);
          }
        }
      }

      update() {
        const bounds = { width: this.canvas.width, height: this.canvas.height };
        for (const boid of this.boids) {
          boid.flock(this.boids, this.params);
        }
        for (const boid of this.boids) {
          boid.update(bounds, this.params);
        }
      }

      draw() {
        const { ctx, canvas } = this;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Optional: simple "dirt paths" texture (just subtle noise)
        ctx.globalAlpha = 0.08;
        for (let i = 0; i < 40; i++) {
          ctx.beginPath();
          const x = Math.random() * canvas.width;
          const y = Math.random() * canvas.height;
          const r = Math.random() * 100 + 40;
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = "#1c3a11";
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        for (const boid of this.boids) {
          boid.draw(ctx);
        }
      }

      loop(timestamp) {
        const dt = timestamp - this.lastTime;
        this.lastTime = timestamp;

        // Basic fixed-ish update (dt not heavily used here but kept for extension)
        if (dt > 0) {
          this.update();
          this.draw();
        }

        requestAnimationFrame(this.loop);
      }
    }

    // --- Init ---------------------------------------------------------------
    window.addEventListener("load", () => {
      const canvas = document.getElementById("canvas");
      const sim = new Simulation(canvas);

      const w = canvas.width;
      const h = canvas.height;

      // Create 3 herds in different areas of the field
      sim.addHerd(60, "#f4f4f4", w * 0.3, h * 0.5, 0); // white sheep
      sim.addHerd(50, "#e8e0c8", w * 0.6, h * 0.4, 1); // beige sheep
      sim.addHerd(40, "#ddddff", w * 0.5, h * 0.7, 2); // bluish-tinted herd
    });
  </script>
</body>
</html>
