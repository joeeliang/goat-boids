<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>Goat Herd Simulation</title>
    <script src="./boids.js"></script>
    <style type="text/css">
      body {
        margin: 0;
        background: #282c34;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      #ui-overlay {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px 20px;
        border-radius: 8px;
        font-size: 14px;
        pointer-events: none;
        z-index: 100;
      }
      #mode-indicator {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
      }
      .attract-mode {
        color: #4CAF50;
      }
      .avoid-mode {
        color: #F44336;
      }
      .instruction {
        font-size: 12px;
        color: #aaa;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <canvas id="boids" width="150" height="150"></canvas>
    <div id="ui-overlay">
      <div id="mode-indicator" class="attract-mode">🍃 ATTRACT MODE</div>
      <div class="instruction">Move mouse: Control treat position</div>
      <div class="instruction">Press SPACE: Toggle attract/avoid</div>
    </div>
  </body>
</html>
